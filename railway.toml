# Railway configuration for the render worker service.
#
# In the Railway dashboard → render worker service → Settings:
#   - Set "Root Directory" to the repo root (default)
#   - The build will pick up this file automatically

[build]
dockerfilePath = "Dockerfile.render-worker"

[deploy]
startCommand = "npm run render-worker"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
